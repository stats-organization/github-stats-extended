packages:
  - apps/*
  - packages/*

allowBuilds:
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

catalog:
  "@vitest/coverage-v8": 4.1.10
  axios: ^1.18.1
  jsdom: 29.1.1
  vite: 8.1.5
  vitest: 4.1.10

overrides:
  # @tailwindcss/node pins lightningcss exactly while vite floats on ^1.32.0.
  # Drop this once @tailwindcss/node pins a version vite also resolves to.
  "vite>lightningcss": 1.32.0

# Deliberately stricter than pnpm 11's 1440 default (7 days vs 1)
minimumReleaseAge: 10080

# Match the repo convention of exact version pins
savePrefix: ""

# Fail on unmet peers and on a Node version outside `engines`, instead of warning
strictPeerDependencies: true
engineStrict: true
