packages:
  - apps/*
  - packages/*

catalog:
  "@vitest/coverage-v8": 5.0.0
  axios: ^1.20.0
  jsdom: 30.1.2
  nock: 15.0.1
  vitest: 5.0.0

overrides:
  # @tailwindcss/node pins lightningcss exactly while vite floats on ^1.32.0, so a cold re-resolve installs both.
  # Updates against the existing lockfile keep 1.32.0 either way, so this only guards re-resolution.
  # Enforced by scripts/assert-deduped.ts; drop it there too once @tailwindcss/node pins a version vite also resolves to.
  "vite>lightningcss": 1.32.0
  # jsdoc-type-pratt-parser 9.2.1+ adds a hard dependency on @types/node@^26, which
  # pulls a second @types/node into the tree and breaks vitest (duplicate instances).
  "jsdoc-type-pratt-parser": 9.2.0
  # https://github.com/stats-organization/github-stats-extended/pull/555 explains why we didn't upgrade to graphql 17 yet.

# Deliberately stricter than pnpm's 1440 default (7 days vs 1)
minimumReleaseAge: 10080

# Reject a version with weaker publish trust evidence than an earlier one.
trustPolicy: no-downgrade

# Fail on unmet peers and on a Node version outside `engines`, instead of warning
strictPeerDependencies: true
engineStrict: true
allowBuilds:
  unrs-resolver: true
