app = 'gh-stats-extended'
primary_region = 'iad'

[build]
dockerfile = "Dockerfile.vercel"
[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = false
min_machines_running = 1
processes = ['app']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 2
memory_mb = 256

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
timeout = "10s"
method = "GET"
path = "/api/status/up"
protocol = "http"

[deploy]
strategy = "bluegreen"
