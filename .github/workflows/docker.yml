name: Docker image

# Permissions are inherited from the calling job; pushing requires `packages: write`.
on:
  workflow_call:
    inputs:
      push:
        description: Push the multi-platform image to the GitHub Container Registry
        type: boolean
        default: false

jobs:
  docker:
    name: Build, test${{ inputs.push && ' and push' || '' }} Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha

      - name: Build Docker image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.vercel
          load: true
          tags: ghcr.io/${{ github.repository }}:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke-test -p 80:80 ghcr.io/${{ github.repository }}:smoke-test
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost/; then
              echo "Server is up"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start"
              docker logs smoke-test
              exit 1
            fi
            sleep 1
          done
          BODY=$(curl -sL http://localhost/)
          echo "Response body (first 500 chars):"
          echo "$BODY" | head -c 500
          echo "$BODY" | grep -qi "wizard" || {
            echo "Expected content not found in response"
            docker logs smoke-test
            exit 1
          }
          docker stop smoke-test

      - name: Build ${{ inputs.push && 'and push ' || '' }}multi-platform Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.vercel
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
